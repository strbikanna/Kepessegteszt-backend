<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="hu">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link th:href="@{/styles/main-style.css}" rel="stylesheet"/>
    <title>Jelszóhelyreállítás</title>
</head>
<body class="spaceBackground d-flex flex-column justify-content-center align-items-center">
<div class="container-sm mt-5">
    <h1 class="text-center">Új jelszó beállítása</h1>
</div>

<div class="mt-2 container-md">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-lg-6">
            <form th:action="@{/mail/reset-password}" th:object="${passwordData}" method="post">
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Jelszó</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" th:field="*{newPassword}"
                           placeholder="Add meg az új jelszavad">
                    <input hidden th:field="*{username}">
                    <input hidden th:field="*{verificationCode}">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-dark w-75 mx-auto">Jelszó mentése</button>
                </div>
            </form>
        </div>
    </div>
</div>


</body>

<!-- Font Awesome for the icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</html>
